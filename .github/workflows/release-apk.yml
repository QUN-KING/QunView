name: Signed Android release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      QUNVIEW_KEYSTORE_BASE64: ${{ secrets.QUNVIEW_KEYSTORE_BASE64 }}
      QUNVIEW_KEYSTORE_PASSWORD: ${{ secrets.QUNVIEW_KEYSTORE_PASSWORD }}
      QUNVIEW_KEY_ALIAS: ${{ secrets.QUNVIEW_KEY_ALIAS }}
      QUNVIEW_KEY_PASSWORD: ${{ secrets.QUNVIEW_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify signing secrets and prepare temporary keystore
        shell: bash
        run: |
          missing=0
          for name in QUNVIEW_KEYSTORE_BASE64 QUNVIEW_KEYSTORE_PASSWORD QUNVIEW_KEY_ALIAS QUNVIEW_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add all four QunView release-signing secrets, then rerun this workflow."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qunview-signing"
          printf '%s' "$QUNVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qunview-signing/release.jks"
          test -s "$RUNNER_TEMP/qunview-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/qunview-signing/release.jks"
          echo "QUNVIEW_KEYSTORE_PATH=$RUNNER_TEMP/qunview-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: qunview-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/qunview-signing"

name: Signed Android release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      QUNVIEW_VERSION_CODE: ${{ github.run_number }}
      KEY_PASSWORD: ${{ secrets.QUNVIEW_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Retrieve latest successful encrypted permanent key artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$KEY_PASSWORD" || { echo "::error::Missing QUNVIEW_KEYSTORE_PASSWORD repository secret."; exit 1; }
          run_id="$(gh run list --workflow create-release-key.yml --status success --limit 10 --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          gh run download "$run_id" --name qunview-encrypted-release-key --dir "$RUNNER_TEMP/qunview-encrypted"
          encrypted="$(find "$RUNNER_TEMP/qunview-encrypted" -type f -name '*.gpg' -print -quit)"
          test -n "$encrypted"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$KEY_PASSWORD" --decrypt --output "$RUNNER_TEMP/qunview-key.tar.gz" "$encrypted"
          mkdir -p "$RUNNER_TEMP/qunview-key"
          tar -xzf "$RUNNER_TEMP/qunview-key.tar.gz" -C "$RUNNER_TEMP/qunview-key"
          test -s "$RUNNER_TEMP/qunview-key/qunview-release.jks"
          test -s "$RUNNER_TEMP/qunview-key/QUNVIEW_KEYSTORE_BASE64.txt"
          keytool -list -keystore "$RUNNER_TEMP/qunview-key/qunview-release.jks" -alias qunview-release -storepass "$KEY_PASSWORD"
          echo "QUNVIEW_KEYSTORE_PATH=$RUNNER_TEMP/qunview-key/qunview-release.jks" >> "$GITHUB_ENV"
          echo "QUNVIEW_KEY_ALIAS=qunview-release" >> "$GITHUB_ENV"
          echo "QUNVIEW_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "QUNVIEW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: qunview-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk#QunView Android APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QunView ${tag}" \
            --notes "Signed QunView Android APK. Install only on a device you trust."

      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/qunview-key" "$RUNNER_TEMP/qunview-encrypted" "$RUNNER_TEMP/qunview-key.tar.gz"

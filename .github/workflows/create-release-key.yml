name: Create encrypted QunView release key

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check password and prevent replacing an existing key
        shell: bash
        env:
          KEY_PASSWORD: ${{ secrets.QUNVIEW_KEYSTORE_PASSWORD }}
          EXISTING_KEY: ${{ secrets.QUNVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_PASSWORD" || { echo "::error::Add QUNVIEW_KEYSTORE_PASSWORD first."; exit 1; }
          test -z "$EXISTING_KEY" || { echo "::error::A permanent key already exists. Refusing to replace it."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate key and encrypted backup
        shell: bash
        env:
          KEY_PASSWORD: ${{ secrets.QUNVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qunview-key"
          mkdir -p "$work"
          keytool -genkeypair -keystore "$work/qunview-release.jks" -alias qunview-release -keyalg RSA -keysize 4096 -validity 10000 -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=QunView Release, OU=Android, O=QunView, L=India, ST=India, C=IN"
          keytool -list -keystore "$work/qunview-release.jks" -alias qunview-release -storepass "$KEY_PASSWORD"
          base64 -w 0 "$work/qunview-release.jks" > "$work/QUNVIEW_KEYSTORE_BASE64.txt"
          printf '%s\n' 'Alias: qunview-release' 'Key password is the same as QUNVIEW_KEYSTORE_PASSWORD.' 'Keep qunview-release.jks private. Add the full Base64 text as QUNVIEW_KEYSTORE_BASE64.' > "$work/README.txt"
          tar -czf "$RUNNER_TEMP/qunview-release-key.tar.gz" -C "$work" qunview-release.jks QUNVIEW_KEYSTORE_BASE64.txt README.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "$KEY_PASSWORD" --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/qunview-release-key-AES256.tar.gz.gpg" "$RUNNER_TEMP/qunview-release-key.tar.gz"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$KEY_PASSWORD" --decrypt --output /dev/null "$RUNNER_TEMP/qunview-release-key-AES256.tar.gz.gpg"
          echo "Encrypted backup created and verified; key material was not printed."

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: qunview-encrypted-release-key
          path: ${{ runner.temp }}/qunview-release-key-AES256.tar.gz.gpg
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary key files
        if: always()
        run: rm -rf "$RUNNER_TEMP/qunview-key" "$RUNNER_TEMP/qunview-release-key.tar.gz" "$RUNNER_TEMP/qunview-release-key-AES256.tar.gz.gpg"

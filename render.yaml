services:
  - type: web
    name: qunview-signaling
    runtime: node
    plan: free
    rootDir: signaling
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
  - type: web
    name: qunview-viewer
    runtime: static
    plan: free
    rootDir: viewer
    buildCommand: ""
    staticPublishPath: .

services:
  - type: web
    name: qunview-signaling
    runtime: node
    plan: free
    rootDir: signaling
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
  - type: web
    name: qunview-viewer
    runtime: static
    plan: free
    rootDir: viewer
    buildCommand: ""
    staticPublishPath: .
